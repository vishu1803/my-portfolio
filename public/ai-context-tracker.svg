<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181920" />
      <stop offset="100%" stop-color="#101116" />
    </linearGradient>
  </defs>

  <!-- Browser Frame Background -->
  <rect width="1920" height="1080" fill="#0d0e12" />

  <!-- Top Browser Navigation Bar -->
  <rect width="1920" height="76" fill="#1b1c22" />
  <rect x="18" y="16" width="220" height="44" rx="10" fill="#24252e" />
  <circle cx="40" cy="38" r="8" fill="#10a37f" />
  <text x="58" y="44" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">ChatGPT</text>

  <!-- Browser URL Bar -->
  <rect x="260" y="16" width="1120" height="44" rx="22" fill="#131418" stroke="#2d2e38" stroke-width="1.5" />
  <text x="290" y="43" fill="#34d399" font-family="system-ui, sans-serif" font-size="14">🔒</text>
  <text x="315" y="44" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="15">chatgpt.com</text>

  <!-- Main Viewport Split -->
  <!-- Left Side: ChatGPT Sidebar & Chat (1440px) -->
  <rect x="0" y="76" width="260" height="1004" fill="#14151a" />
  <text x="32" y="130" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="15" font-weight="600">+ New chat</text>
  <text x="32" y="180" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14">🔍 Search chats</text>
  <text x="32" y="225" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14">🖼 Images</text>
  <text x="32" y="270" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14">☷ Apps</text>
  <text x="32" y="315" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14">⚡ Deep research</text>

  <!-- Center Chat Area -->
  <rect x="260" y="76" width="1180" height="1004" fill="#0d0e12" />

  <!-- User Message Bubble -->
  <rect x="980" y="160" width="240" height="48" rx="24" fill="#262730" />
  <text x="1004" y="190" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15">help me with today news</text>

  <!-- Assistant Response -->
  <text x="340" y="260" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="18" font-weight="500">Here are some of the top headlines for today (July 14, 2026):</text>

  <!-- News Cards -->
  <!-- Card 1 -->
  <rect x="340" y="300" width="240" height="340" rx="16" fill="#17181f" stroke="#2a2b36" stroke-width="1.5" />
  <rect x="340" y="300" width="240" height="160" rx="16" fill="#2d3748" />
  <text x="360" y="490" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">● euronews</text>
  <text x="360" y="525" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Video. Latest news bulletin</text>
  <text x="360" y="550" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">July 14th, 2026 - Morning</text>

  <!-- Card 2 -->
  <rect x="610" y="300" width="240" height="340" rx="16" fill="#17181f" stroke="#2a2b36" stroke-width="1.5" />
  <rect x="610" y="300" width="240" height="160" rx="16" fill="#78350f" />
  <text x="630" y="490" fill="#fb923c" font-family="system-ui, sans-serif" font-size="12" font-weight="600">● The Indian Express</text>
  <text x="630" y="525" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Daily Briefing: Hormuz</text>
  <text x="630" y="550" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">Crisis & Border Policy in focus</text>

  <!-- Card 3 -->
  <rect x="880" y="300" width="240" height="340" rx="16" fill="#17181f" stroke="#2a2b36" stroke-width="1.5" />
  <rect x="880" y="300" width="240" height="160" rx="16" fill="#991b1b" />
  <text x="900" y="490" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="600">● The Guardian</text>
  <text x="900" y="525" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Gulf Tensions Escalate</text>
  <text x="900" y="550" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">Commercial Tankers Live Feed</text>

  <!-- Bottom Chat Input Bar -->
  <rect x="340" y="930" width="800" height="60" rx="30" fill="#181921" stroke="#2d2e38" stroke-width="1.5" />
  <text x="380" y="966" fill="#71717a" font-family="system-ui, sans-serif" font-size="16">+ Ask anything</text>
  <circle cx="1060" cy="960" r="16" fill="#282935" />
  <circle cx="1105" cy="960" r="16" fill="#ffffff" />

  <!-- RIGHT SIDE: AI CONTEXT TRACKER PANEL (480px) -->
  <rect x="1440" y="76" width="480" height="1004" fill="url(#panelGrad)" stroke="#23242d" stroke-width="2" />

  <!-- Panel Header -->
  <rect x="1440" y="76" width="480" height="68" fill="#14151b" stroke="#22232c" stroke-width="1" />
  <rect x="1465" y="94" width="30" height="30" rx="8" fill="#2563eb" />
  <text x="1473" y="115" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">A</text>
  <text x="1510" y="116" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="600">AI Context Tracker</text>
  <text x="1870" y="116" fill="#71717a" font-family="system-ui, sans-serif" font-size="18">✕</text>

  <!-- Extension Tab Bar -->
  <rect x="1440" y="144" width="480" height="50" fill="#101116" stroke="#202129" stroke-width="1" />
  <text x="1485" y="175" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Dashboard</text>
  <rect x="1475" y="191" width="85" height="3" fill="#38bdf8" />
  <text x="1605" y="175" fill="#71717a" font-family="system-ui, sans-serif" font-size="14">Summary</text>
  <text x="1715" y="175" fill="#71717a" font-family="system-ui, sans-serif" font-size="14">History</text>
  <text x="1815" y="175" fill="#71717a" font-family="system-ui, sans-serif" font-size="14">Snapshots</text>

  <!-- Idle Status Dot -->
  <circle cx="1475" cy="235" r="5" fill="#94a3b8" />
  <text x="1490" y="239" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Idle</text>

  <!-- Radial Gauge Arc -->
  <path d="M 1560 360 A 120 120 0 0 1 1800 360" fill="none" stroke="#27272a" stroke-width="14" stroke-linecap="round" />
  <path d="M 1560 360 A 120 120 0 0 1 1600 310" fill="none" stroke="url(#gaugeGrad)" stroke-width="14" stroke-linecap="round" />
  <text x="1680" y="355" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="52" font-weight="700">0%</text>

  <!-- 2x2 Telemetry Metric Cards -->
  <!-- Metric Card 1: Tokens Used -->
  <rect x="1465" y="420" width="205" height="96" rx="14" fill="url(#cardGrad)" stroke="#272832" stroke-width="1" />
  <text x="1485" y="450" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">TOKENS USED</text>
  <text x="1485" y="495" fill="#ffffff" font-family="system-ui, sans-serif" font-size="30" font-weight="700">0.0k</text>
  <rect x="1590" y="475" width="46" height="22" rx="6" fill="#1e293b" />
  <text x="1598" y="490" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">+12%</text>

  <!-- Metric Card 2: Context Limit -->
  <rect x="1690" y="420" width="205" height="96" rx="14" fill="url(#cardGrad)" stroke="#272832" stroke-width="1" />
  <text x="1710" y="450" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CONTEXT LIMIT</text>
  <text x="1710" y="495" fill="#ffffff" font-family="system-ui, sans-serif" font-size="30" font-weight="700">128k</text>

  <!-- Metric Card 3: Total Turns -->
  <rect x="1465" y="535" width="205" height="96" rx="14" fill="url(#cardGrad)" stroke="#272832" stroke-width="1" />
  <text x="1485" y="565" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">TOTAL TURNS</text>
  <text x="1485" y="610" fill="#ffffff" font-family="system-ui, sans-serif" font-size="30" font-weight="700">0</text>

  <!-- Metric Card 4: Avg/Turn -->
  <rect x="1690" y="535" width="205" height="96" rx="14" fill="url(#cardGrad)" stroke="#272832" stroke-width="1" />
  <text x="1710" y="565" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">AVG/TURN</text>
  <text x="1710" y="610" fill="#ffffff" font-family="system-ui, sans-serif" font-size="30" font-weight="700">0.0k</text>

  <!-- HEALTH SIGNALS Section -->
  <text x="1465" y="685" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">HEALTH SIGNALS</text>

  <!-- Context Fill Progress Bar -->
  <text x="1465" y="725" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Context Fill</text>
  <text x="1870" y="725" text-anchor="end" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">0%</text>
  <rect x="1465" y="740" width="430" height="6" rx="3" fill="#22232c" />
  <rect x="1465" y="740" width="10" height="6" rx="3" fill="#38bdf8" />

  <!-- Health Signals List -->
  <g transform="translate(1465, 780)">
    <circle cx="6" cy="6" r="4" fill="#34d399" />
    <text x="22" y="10" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Response Repetition</text>
    <text x="430" y="10" text-anchor="end" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Low</text>

    <circle cx="6" cy="46" r="4" fill="#34d399" />
    <text x="22" y="50" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Instruction Drift</text>
    <text x="430" y="50" text-anchor="end" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="500">None</text>

    <circle cx="6" cy="86" r="4" fill="#34d399" />
    <text x="22" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Response Length</text>
    <text x="430" y="90" text-anchor="end" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Stable</text>

    <circle cx="6" cy="126" r="4" fill="#fbbf24" />
    <text x="22" y="130" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Turn Count</text>
    <text x="430" y="130" text-anchor="end" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="500">0 turns</text>
  </g>
</svg>
